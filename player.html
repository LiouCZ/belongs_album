<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Belongs 玩家分享画册</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img class="brand-logo" src="assets/belongs-logo.png" alt="Belongs logo" />
        </div>
        <div>
          <h1>Belongs 玩家分享画册</h1>
          <p>玩家分享合集</p>
          <p class="brand-public-info"><span>小红书号：BELONGS</span><span>微信公众号：BELONGS OFFICIAL</span></p>
        </div>
      </div>
      <div class="top-actions">
        <nav class="site-nav" aria-label="画册切换">
          <a class="top-link" href="index.html">官方画册</a>
          <a class="top-link is-active" href="player.html" aria-current="page">玩家分享</a>
          <a class="top-link" href="brand-story.html">品牌故事</a>
        </nav>
        <a class="top-link top-link--utility" href="vip.html">VIP 定制登记</a>
        <div class="stats" aria-live="polite">
          <span id="visibleCount">0</span>
          <span class="muted">/</span>
          <span id="totalCount">0</span>
          <span class="stats-unit">组</span>
        </div>
      </div>
    </header>

    <main class="player-album" id="playerAlbum">
      <section class="player-collection" id="collectionSpotlight" aria-label="玩家分享合集" hidden>
        <div class="player-collection-image"><img id="collectionCover" alt="" /></div>
        <div class="player-collection-copy">
          <p class="player-collection-label">玩家分享 / COLLECTION</p>
          <h2 id="collectionTitle"></h2>
          <p id="collectionCount"></p>
          <div class="collection-filter" id="collectionFilter" aria-label="合集筛选"></div>
        </div>
      </section>

      <section class="controls" aria-label="检索筛选">
        <label class="search-wrap">
          <span>搜索</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索作品编号、名称或描述" />
        </label>
        <label class="page-size-wrap">
          <span>每页</span>
          <select class="album-select" id="pageSizeSelect" aria-label="每页显示数量">
            <button type="button"><selectedcontent></selectedcontent></button>
            <option value="20" selected>20 组</option>
            <option value="25">25 组</option>
            <option value="30">30 组</option>
            <option value="35">35 组</option>
            <option value="40">40 组</option>
            <option value="45">45 组</option>
            <option value="50">50 组</option>
            <option value="55">55 组</option>
            <option value="60">60 组</option>
            <option value="65">65 组</option>
            <option value="70">70 组</option>
            <option value="75">75 组</option>
            <option value="80">80 组</option>
            <option value="85">85 组</option>
            <option value="90">90 组</option>
            <option value="95">95 组</option>
            <option value="100">100 组</option>
          </select>
        </label>
      </section>

      <section class="summary" id="summaryText">正在加载玩家分享数据...</section>

      <section class="gallery" id="gallery" aria-label="玩家分享图文列表"></section>

      <nav class="pagination" id="pagination" aria-label="分页" hidden>
        <button type="button" id="firstPage" aria-label="第一页" title="第一页">
          <svg class="pagination-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
        </button>
        <button type="button" id="prevPage" aria-label="上一页" title="上一页">
          <svg class="pagination-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="page-numbers" id="pageNumbers" aria-label="选择页码"></div>
        <button type="button" id="nextPage" aria-label="下一页" title="下一页">
          <svg class="pagination-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button type="button" id="lastPage" aria-label="最后一页" title="最后一页">
          <svg class="pagination-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
        </button>
        <span id="pageInfo" aria-live="polite">第 1 / 1 页</span>
      </nav>

      <section class="empty" id="emptyState" hidden>
        <h2>暂无玩家分享图文</h2>
        <p>请试试其他关键词或合集。</p>
      </section>
    </main>

    <dialog class="detail" id="detailDialog">
      <button class="close-button" id="closeDialog" aria-label="关闭">×</button>
      <div class="detail-grid">
        <figure>
          <img id="detailImage" alt="" />
          <div class="carousel-controls" id="carouselControls" hidden>
            <button type="button" id="prevImage" aria-label="上一张">‹</button>
            <span id="carouselCount">1 / 1</span>
            <button type="button" id="nextImage" aria-label="下一张">›</button>
          </div>
        </figure>
        <article>
          <div class="detail-meta" id="detailMeta"></div>
          <h2 id="detailTitle"></h2>
          <p class="detail-index" id="detailIndex"></p>
          <div class="detail-caption" id="detailCaption"></div>
        </article>
      </div>
    </dialog>

    <script src="data/player-items.js"></script>
    <script src="app.js"></script>
    <script src="site-stamp.js"></script>
    <script src="page-transition.js"></script>
  </body>
</html>
